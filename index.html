
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>BAON — Budget &amp; Expense Tracker</title>

  <meta name="theme-color" content="#151A3B">

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>

<body>

  <header class="topbar">
    <h1 class="logo">BAON<span>.</span></h1>
  </header>

  <main id="view" class="view" tabindex="-1" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>

  <nav class="tabbar" aria-label="Main">

    <a href="#/home" data-route="home">
      <span>🏠</span>
      Home
    </a>

    <a href="#/history" data-route="history">
      <span>🧾</span>
      History
    </a>

    <a
      href="#/add"
      data-route="add"
      class="fab"
      aria-label="Add expense"
    >+</a>

    <a href="#/settings" data-route="settings">
      <span>⚙️</span>
      Budget
    </a>

  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

</body>
</html>
